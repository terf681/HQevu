<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVU // HQ — Вход по ключу</title>
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="hq.css">
</head>
<body>
<div class="bg" aria-hidden="true"><div class="g"></div><div class="s"></div></div>
<div class="wrap">
  <main class="panel" id="p">
    <svg class="emb" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="a"><circle cx="60" cy="60" r="56"/><circle cx="60" cy="60" r="42" stroke-dasharray="3 5"/><path d="M30 32 L60 92 L90 32"/><path d="M45 32 L60 62 L75 32"/><path d="M60 4V18M60 102V116M4 60H18M102 60H116"/></g></svg>
    <span class="tag">EVU // HEADQUARTERS</span>
    <h1>Штаб EVU</h1>
    <p class="sub">Закрытая система управления личным составом. Введите ключ доступа.</p>
    <form id="f" autocomplete="off" novalidate>
      <label for="k">Ключ доступа</label>
      <input class="inp" id="k" name="k" type="password" placeholder="EVU-XXX-XXXX-XXXX" maxlength="24" spellcheck="false" autocapitalize="characters" autocomplete="off" aria-describedby="e" required>
      <div class="err" id="e" role="alert"></div>
      <button class="btn" id="go" type="submit"><span class="sp"></span><span id="gt">Войти</span></button>
    </form>
    <div class="note" id="n">Ключ выдаёт владелец организации.<br><a href="../index.html">Архив EVU</a></div>
  </main>
</div>
<script src="config.js"></script>
<script src="core.js"></script>
<script>
(function () {
"use strict";
var $ = function (s) { return document.querySelector(s); }, k = $("#k"), e = $("#e"), b = $("#go"), f = $("#f");
var RE = /^EVU-(OWNER|CMD|MBR)-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$/;
function msg(t) { e.textContent = t || ""; e.classList.toggle("show", !!t); k.classList.toggle("bad", !!t); if (t) { k.style.animation = "none"; void k.offsetWidth; k.style.animation = ""; } }
function busy(v) { b.disabled = v; b.classList.toggle("load", v); $("#gt").textContent = v ? "Проверка ключа..." : "Войти"; k.readOnly = v; }
k.addEventListener("input", function () { var p = k.selectionStart; k.value = k.value.toUpperCase().replace(/[^A-Z0-9-]/g, ""); if (e.classList.contains("show")) msg(""); });
k.addEventListener("dblclick", function () { k.type = k.type === "password" ? "text" : "password"; });
if (!HQ.configured) { $("#n").innerHTML = "<b>ДЕМО-РЕЖИМ</b> · Supabase не подключён, данные только в этом браузере<br>EVU-OWNER-DEMX-2345 · EVU-CMD-DEMX-2345 · EVU-MBR-DEMX-2345<br><a href=\"../index.html\">Архив EVU</a>"; }
if (HQ.session()) {
  busy(true); $("#gt").textContent = "Проверка сессии...";
  HQ.check().then(function (u) { if (u) location.replace("index.html"); else busy(false); }, function () { busy(false); });
}
f.addEventListener("submit", async function (ev) {
  ev.preventDefault(); var v = k.value.trim();
  if (!v) return msg("Введите ключ доступа.");
  if (!RE.test(v)) return msg("Неверный формат. Пример: EVU-MBR-AB23-CD45.");
  msg(""); busy(true);
  try { await HQ.login(v); $("#gt").textContent = "Доступ разрешён"; location.replace("index.html"); }
  catch (er) { busy(false); msg(er.code === "bad_key" || er.code === "rate_limited" || er.code === "network" || er.code === "config" ? er.message : (er.message || "Ошибка входа.")); k.focus(); }
});
})();
</script>
</body>
</html>
